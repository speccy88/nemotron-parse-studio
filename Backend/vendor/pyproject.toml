[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-parse"
version = "3.5.0.post3"
description = "Nemotron 3.5 Parse document parsing and vLLM integration"
requires-python = ">=3.10"
license = "LicenseRef-OpenMDW-1.1"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "TOKENIZER_ATTRIBUTION.md"]
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.14.1",
    "huggingface-hub==1.24.0",
    "accelerate==1.12.0",
    "timm==1.0.22",
    "einops==0.8.1",
    "Pillow==12.2.0",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "beautifulsoup4==4.13.3",
]

# FlashAttention FA3 is supplied by vllm==0.26.0, not a standalone flash-attn wheel.
# Upstream source metadata: 2.8.4; vLLM fork commit caaa4eb59845388a20b1f435ecaafb4bd9517ad8.
[project.optional-dependencies]
vllm = ["vllm==0.26.0"]
client = ["openai==2.30.0", "httpx==0.28.1"]
dev = ["pytest==9.0.2"]

[project.entry-points."vllm.general_plugins"]
nemotron_parse_35 = "vllm_tied_patch.plugin:register"

[project.scripts]
nemotron-parse = "nemotron_parse.inference:main"

[tool.setuptools]
py-modules = ["postprocessing", "latex2html"]

[tool.setuptools.packages.find]
include = ["vllm_tied_patch*", "nemotron_parse*"]

[tool.setuptools.package-data]
nemotron_parse = ["SOURCE_MANIFEST.json"]

[tool.uv]
package = true
